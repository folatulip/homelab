# DMZ worker (zone = "dmz"). Only pods that tolerate this taint land here.
# The taint keeps trusted pods off by default; the real boundary is the
# node-restriction.kubernetes.io/zone label that Terraform sets as admin
# (talos.tf), because a node can't change that one itself.
# See doc/adr/0001-single-cluster-cilium.md.
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  felixlatulip.ca/zone: dmz:NoSchedule
