# Directory for local-path-provisioner's PersistentVolumes
# (kubernetes/infrastructure/local-path-provisioner), created on the EPHEMERAL
# partition at /var/mnt/local-path-provisioner. User volumes under /var/mnt are
# the only host paths the kubelet sees; Talos >= 1.14 dropped
# .machine.kubelet.extraMounts (it conflicts with the KubeletConfig document).
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
volumeType: directory
