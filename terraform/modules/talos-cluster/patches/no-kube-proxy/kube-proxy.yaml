# kube_proxy = false: Cilium replaces kube-proxy and reaches the API server
# through KubePrism (localhost:7445, on by default).
# Talos >= 1.14: kube-proxy is its own document; deleting it means no
# kube-proxy DaemonSet. (.cluster.proxy.disabled is rejected next to it.)
apiVersion: v1alpha1
kind: KubeProxyConfig
$patch: delete
