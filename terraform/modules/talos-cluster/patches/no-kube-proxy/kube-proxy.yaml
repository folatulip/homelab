# kube_proxy = false: Cilium replaces kube-proxy and reaches the API server
# through KubePrism (localhost:7445, on by default).
# Talos >= 1.14: kube-proxy is its own document. Deleting it doesn't work,
# Talos falls back to the default (enabled), so set enabled: false instead.
# Talos doesn't remove an existing kube-proxy DaemonSet, delete it by hand.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
