# Template for a Helm-based app on k8s-trusted. See "Adding a new service" in the
# root README. Copy to kubernetes/apps/APP_NAME/ and replace every placeholder:
#   APP_NAME       app name: folder, namespace, release and hostname
#   REPO_NAME      short name for the chart repository (e.g. bjw-s, helmforge)
#   REPO_URL       chart repository URL (https://... or oci://...)
#   CHART_NAME     chart name inside that repository
#   CHART_VERSION  exact chart version (Renovate bumps it once it's in kubernetes/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: APP_NAME
resources:
  - namespace.yaml
  - secret.sops.yaml # remove if the app needs no secret
  - pvcs.yaml # remove if the app keeps no data
  - helmrepository.yaml
  - helmrelease.yaml
