# LAN apps. Only the ones listed in kubernetes/apps/trusted/k8s-geese/ while
# k8s-trusted still runs the others (ADR 0001, step 7).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-trusted
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
    - name: local-path-provisioner
    - name: longhorn
    - name: longhorn-config
  interval: 10m
  retryInterval: 1m
  # Trusted zone (ADR 0001): every Namespace gets the zone label.
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: trusted
  path: ./kubernetes/apps/trusted/k8s-geese
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Public apps, reached through the Cloudflare Tunnel. To add one:
# 1. create kubernetes/apps/dmz/<name>/ with its own Namespace, and list it in
#    kubernetes/apps/dmz/kustomization.yaml
# 2. add the namespace to providers.kubernetesIngress.namespaces in
#    infrastructure/traefik-dmz/helmrelease.yaml (same PR is fine: traefik-dmz
#    waits for this one)
# The patches below put it in the DMZ zone; apps don't have to.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dmz
  namespace: flux-system
spec:
  dependsOn:
    - name: zone-isolation
    - name: local-path-provisioner
  interval: 10m
  retryInterval: 1m
  # DMZ zone (ADR 0001): every Deployment only runs on DMZ nodes and gets no
  # API token, every Namespace gets the dmz zone label and the restricted Pod
  # Security level. zone-isolation rejects DMZ pods without this.
  patches:
    - target:
        kind: Deployment
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: any
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: node-restriction.kubernetes.io/zone
                            operator: In
                            values: [dmz]
              tolerations:
                - key: felixlatulip.ca/zone
                  operator: Equal
                  value: dmz
                  effect: NoSchedule
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: dmz
            pod-security.kubernetes.io/enforce: restricted
    # Public Ingresses always go to the DMZ Traefik
    - target:
        kind: Ingress
      patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: any
          annotations:
            kubernetes.io/ingress.class: traefik-dmz
        spec:
          ingressClassName: null
  path: ./kubernetes/apps/dmz
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
