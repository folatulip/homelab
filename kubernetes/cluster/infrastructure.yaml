# k8s-geese add-ons, applied by Flux in dependency order.
# Not bootstrapped yet: this folder becomes live with
#   flux bootstrap github ... --path=kubernetes/cluster
# after scripts/bootstrap-cilium.sh (ADR 0001, step 5).
# wait: true = a Kustomization is only Ready once its workloads are healthy,
# so dependents (dependsOn) don't start too early.
#
# Cilium is already installed by scripts/bootstrap-cilium.sh; this takes the
# release over. Everything else depends on it, since pods need the CNI.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/infrastructure/cilium
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# LB IP pool + L2 policy are Cilium CRDs; they need Cilium first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-config
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/infrastructure/cilium-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Admission policies + network policies keeping the zones apart (ADR 0001).
# Everything in the DMZ waits for this, so nothing public runs unprotected.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zone-isolation
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/infrastructure/zone-isolation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  retryInterval: 1m
  # Trusted zone (ADR 0001): every Namespace gets the zone label.
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: trusted
  path: ./kubernetes/infrastructure/local-path-provisioner
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Trusted ingress. Its LoadBalancer Service needs the IP pool.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-config
  interval: 1h
  retryInterval: 1m
  # Trusted zone (ADR 0001): every Namespace gets the zone label.
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: trusted
  postBuild:
    substitute:
      TRAEFIK_IP: 10.10.20.221
  path: ./kubernetes/infrastructure/traefik
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Public ingress, on DMZ nodes. ClusterIP only, so no IP pool needed.
# After apps-dmz: its Helm chart puts a Role in each DMZ app's namespace, so
# the namespaces have to exist first. Its own namespace is labeled dmz in
# infrastructure/traefik-dmz/namespace.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-dmz
  namespace: flux-system
spec:
  dependsOn:
    - name: zone-isolation
    - name: apps-dmz
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/infrastructure/traefik-dmz
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  retryInterval: 1m
  # Trusted zone (ADR 0001): every Namespace gets the zone label.
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: trusted
  path: ./kubernetes/infrastructure/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Issuers + the wildcard cert need cert-manager's webhook running; the TLSStore
# is a Traefik CRD. wait: true = Ready only once the wildcard cert is issued.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: traefik
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/infrastructure/cert-manager-config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Trusted nodes only: they're the ones with a data disk, and Longhorn doesn't
# tolerate the DMZ taint. wait: true = Ready once the HelmRelease is healthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  retryInterval: 1m
  timeout: 10m # first install pulls ~15 images
  # Trusted zone (ADR 0001): every Namespace gets the zone label.
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: trusted
  path: ./kubernetes/infrastructure/longhorn
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# RecurringJob is a Longhorn CRD; it needs Longhorn first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/infrastructure/longhorn-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Cloudflare Tunnel connector, in the DMZ zone. Sends public requests to traefik-dmz.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik-dmz
  interval: 1h
  retryInterval: 1m
  # DMZ zone (ADR 0001): every Deployment only runs on DMZ nodes and gets no
  # API token, every Namespace gets the dmz zone label and the restricted Pod
  # Security level. zone-isolation rejects DMZ pods without this.
  patches:
    - target:
        kind: Deployment
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: any
        spec:
          template:
            spec:
              automountServiceAccountToken: false
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: node-restriction.kubernetes.io/zone
                            operator: In
                            values: [dmz]
              tolerations:
                - key: felixlatulip.ca/zone
                  operator: Equal
                  value: dmz
                  effect: NoSchedule
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: dmz
            pod-security.kubernetes.io/enforce: restricted
  path: ./kubernetes/infrastructure/cloudflared
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# Prometheus (kube-prometheus-stack). Needs Longhorn for its volume.
# wait: true = the ServiceMonitor CRDs exist before apps-trusted uses them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  # Trusted zone (ADR 0001): every Namespace gets the zone label.
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: any
          labels:
            felixlatulip.ca/zone: trusted
  path: ./kubernetes/infrastructure/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
---
# ServiceMonitors/PodMonitors for the other add-ons; needs the CRDs from
# monitoring.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-targets
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/monitoring-targets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
