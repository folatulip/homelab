# All my services. Starts after ingress and storage are ready.
# To add an app: create kubernetes/apps/<name>/ and list it in
# kubernetes/apps/kustomization.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
    - name: local-path-provisioner
    - name: longhorn
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age
    provider: sops
    secretRef:
      name: sops-age
