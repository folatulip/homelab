# Public apps (kubernetes/dmz/apps/), reachable through the Cloudflare Tunnel.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
    - name: local-path-provisioner
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/dmz/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption: # *.sops.yaml under kubernetes/dmz/ use the DMZ age key
    provider: sops
    secretRef:
      name: sops-age
