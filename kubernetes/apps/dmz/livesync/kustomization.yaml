# Obsidian Self-hosted LiveSync: a CouchDB the Obsidian plugin syncs vaults
# through. Public at https://obsidian.felixlatulip.ca (Cloudflare Tunnel, behind
# Cloudflare Access). Setup and recovery: doc/runbooks/obsidian.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: livesync
resources:
  - namespace.yaml
  - secret.sops.yaml
  - pvcs.yaml
  - couchdb.yaml
  - ingress.yaml
configMapGenerator:
  - name: couchdb-config
    files:
      - livesync.ini
