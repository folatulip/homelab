# Public Ingress. Flux points it at traefik-dmz (kubernetes/cluster/apps.yaml)
# and Cloudflare terminates HTTPS, so no class or tls section here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: couchdb
spec:
  rules:
    - host: obsidian.felixlatulip.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: couchdb
                port: { number: 5984 }
