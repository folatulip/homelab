# Synced vault data. longhorn-retain keeps the volume if the PVC is deleted,
# and the annotation stops Flux from ever pruning it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
