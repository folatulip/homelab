apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: perses
spec:
  interval: 1h
  chart:
    spec:
      chart: perses
      version: 0.24.0 # Perses v0.55.0
      sourceRef:
        kind: HelmRepository
        name: perses
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  # All values: https://github.com/perses/helm-charts/blob/main/charts/perses/values.yaml
  values:
    config:
      security:
        # Stable key so secrets saved in Perses still decrypt (and logins stay
        # valid) after a restart
        encryption_key_file: /etc/perses/secret/encryption-key
        # Traefik serves HTTPS, so the session cookie can be secure
        cookie:
          secure: true
        # Username/password login, accounts stored in Perses itself
        enable_auth: true
        authentication:
          providers:
            enable_native: true
          # Open so the first account can be made. Set to true once "felix"
          # exists, or anyone on the LAN can still sign up (with no rights).
          disable_sign_up: false
      # Read the files the sidecar drops in (datasource + admin binding) every minute
      provisioning:
        folders:
          - /etc/perses/provisioning
        interval: 1m

    # Loads ConfigMaps labeled perses.dev/resource=true (datasource.yaml) and
    # makes the users below global admins
    sidecar:
      enabled: true
      allNamespaces: false # only the perses namespace, so a Role instead of a ClusterRole
      globalAdminUsers:
        - folatulip
      resources:
        requests: { cpu: 5m, memory: 32Mi }
        limits: { memory: 128Mi }

    # Prometheus scrapes Perses too
    serviceMonitor:
      selfMonitor: true
      # The chart leaves this empty; match the main Service, not the headless one
      selector:
        matchLabels:
          app.kubernetes.io/name: perses
          app.kubernetes.io/component: networking

    # Mount the key from secret.sops.yaml
    volumes:
      - name: secret
        secret:
          secretName: perses-secret
    volumeMounts:
      - name: secret
        mountPath: /etc/perses/secret
        readOnly: true

    # Dashboards live on disk (file DB). The chart has no existingClaim option,
    # so it makes its own PVC; keep it on longhorn-retain and never delete it.
    persistence:
      enabled: true
      storageClass: longhorn-retain
      size: 2Gi
      annotations:
        helm.sh/resource-policy: keep
        kustomize.toolkit.fluxcd.io/prune: disabled

    # helm test pod pulls a :main image, not needed here
    testFramework:
      enabled: false

    ingress:
      enabled: true
      hosts:
        - host: perses.lab.felixlatulip.ca
          paths:
            - path: /
              pathType: Prefix

    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
