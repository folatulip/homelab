# Default Prometheus datasource for every project. Perses queries it through
# its own proxy, so the browser never talks to Prometheus directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-datasource-prometheus
  labels:
    perses.dev/resource: "true" # picked up by the Perses sidecar
data:
  prometheus.yaml: |
    kind: GlobalDatasource
    metadata:
      name: prometheus
    spec:
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          proxy:
            kind: HTTPProxy
            spec:
              url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
