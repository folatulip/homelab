# Trusted apps already moved to k8s-geese (ADR 0001, step 7). k8s-trusted
# still deploys the list in ../kustomization.yaml, so an app moves by going
# from that list to this one in its feat/migrate-<app> PR (after the Longhorn
# restore). Once k8s-trusted is gone (step 8), this list replaces that one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - fallback-k8s-trusted.yaml # until step 8, see the file
  - ../hello # test app, no data
  - ../proxmox # pve.lab route, no data. Still on k8s-trusted too until step 8 (rollback).
  - ../vaultwarden # data restored from Longhorn backup vaultwarden-migrate. Old copy suspended at 0 on k8s-trusted (rollback).
  - ../sure # 4 volumes restored from Longhorn backups sure-*-migrate. Old copy at 0 on k8s-trusted (rollback).
