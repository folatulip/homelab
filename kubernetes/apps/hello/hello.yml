apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 3
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  type: ClusterIP            # in-cluster only; reached from the LAN through Traefik (ingress.yml)
  selector: { app: hello }   # sends traffic to pods carrying this label
  ports:
    - port: 80
      targetPort: 80