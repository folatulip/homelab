# cert-manager controller, webhook and cainjector: the upstream static manifest
# (CRDs included, creates the cert-manager namespace).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
patches:
  # DNS-01 self-check over DNS-over-HTTPS. The UniFi gateway intercepts all
  # port-53 traffic (whatever server it's addressed to) and answers
  # *.lab.felixlatulip.ca from its local wildcard record, which hides
  # _acme-challenge.lab. DoH to Cloudflare's resolver goes around it.
  # "-only": ask the resolver for the TXT record too, instead of querying the
  # authoritative servers on port 53 (intercepted as well). Drawback: a
  # not-found answer cached by 1.1.1.1 can delay issuance by up to ~30 min.
  - target:
      kind: Deployment
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers=https://1.1.1.1/dns-query,https://1.0.0.1/dns-query
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers-only
