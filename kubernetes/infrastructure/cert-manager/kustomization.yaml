# cert-manager controller, webhook and cainjector: the upstream static manifest
# (CRDs included, creates the cert-manager namespace).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
patches:
  # Check DNS-01 TXT records against Cloudflare's public resolvers, not the LAN
  # resolver (the gateway may answer for lab.felixlatulip.ca itself).
  - target:
      kind: Deployment
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers-only
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
