# cert-manager controller, webhook and cainjector: the upstream static manifest
# (CRDs included, creates the cert-manager namespace).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
patches:
  # DNS-01 self-check: find the zone's nameservers via public resolvers (not
  # the LAN gateway, which answers for *.lab.felixlatulip.ca itself), then ask
  # Cloudflare's authoritative servers directly. Asking 1.1.1.1 for the TXT
  # record ("-only" mode) caches the not-found answer for 30 min.
  - target:
      kind: Deployment
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
