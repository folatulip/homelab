# cert-manager controller, webhook and cainjector, installed with the official
# Helm chart (CRDs included). Flux fetches the chart in the cluster, so CI has
# nothing to download for it.
#
# Until 2026-11 this was the upstream static manifest (cert-manager.yaml from
# the GitHub release). The Helm release took over the same objects in place;
# see doc/runbooks/cert-manager-helm-migration.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
