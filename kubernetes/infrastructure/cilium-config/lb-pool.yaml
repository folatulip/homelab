# LoadBalancer IPs on VLAN 20. .221-.240, not the old MetalLB .200-.220, so
# both clusters could run side by side during the migration (ADR 0001). DMZ has no pool: the DMZ Traefik
# is ClusterIP only, cloudflared reaches it from inside the cluster.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: trusted
spec:
  blocks:
    - start: 10.10.20.221
      stop: 10.10.20.240
