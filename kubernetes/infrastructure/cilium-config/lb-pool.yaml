# LoadBalancer IPs on VLAN 20. Not MetalLB's .200-.220, so both can run while
# apps move from k8s-trusted to k8s-geese. DMZ has no pool: the DMZ Traefik
# is ClusterIP only, cloudflared reaches it from inside the cluster.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: trusted
spec:
  blocks:
    - start: 10.10.20.221
      stop: 10.10.20.240
