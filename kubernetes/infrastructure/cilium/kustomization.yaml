# Cilium: the CNI on k8s-geese, replacing flannel, kube-proxy and MetalLB.
# See doc/adr/0001-single-cluster-cilium.md.
#
# Flux can't start before a CNI exists, so the first install is done by
# scripts/bootstrap-cilium.sh with the same values.yaml. This HelmRelease has
# the same name and namespace (cilium in kube-system), so Flux takes over
# that release instead of installing a second one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
# values.yaml -> ConfigMap, read by the HelmRelease (valuesFrom).
# No hash suffix: kustomize can't rename the reference inside a HelmRelease.
# The watch label makes Flux upgrade as soon as the values change.
configMapGenerator:
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
