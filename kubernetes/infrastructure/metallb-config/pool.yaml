# LAN IPs MetalLB may hand to Services of type LoadBalancer.
# Must be outside the router's DHCP range and not used by any other device.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
  namespace: metallb-system
spec:
  addresses:
    - 10.10.20.200-10.10.20.220
---
# L2 mode: the node holding an IP answers ARP for it on VLAN 20.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan
