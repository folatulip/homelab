# IPs MetalLB may hand to Services of type LoadBalancer.
# Must be outside the router's DHCP range and not used by any other device.
# LB_RANGE is set per cluster (postBuild.substitute in kubernetes/clusters/<cluster>/).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
  namespace: metallb-system
spec:
  addresses:
    - ${LB_RANGE}
---
# L2 mode: the node holding an IP answers ARP for it on the cluster's VLAN.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan
