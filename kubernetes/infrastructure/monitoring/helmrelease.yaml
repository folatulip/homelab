apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.1.1 # Prometheus Operator v0.95.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # All values: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    # Grafana gets the Prometheus datasource and the k8s/node dashboards from
    # the chart for free.
    grafana:
      enabled: true
      # Login from grafana-admin.sops.yaml (user folatulip)
      admin:
        existingSecret: grafana-admin
      grafana.ini:
        server:
          root_url: https://grafana.lab.felixlatulip.ca
        users:
          allow_sign_up: false
      # PVC from grafana-pvc.yaml. RWO, so the old pod has to stop before the
      # new one can mount it.
      persistence:
        enabled: true
        existingClaim: grafana-data
      deploymentStrategy:
        type: Recreate
      ingress:
        enabled: true
        hosts:
          - grafana.lab.felixlatulip.ca
        path: /
        pathType: Prefix
      resources:
        requests: { cpu: 25m, memory: 128Mi }
        limits: { memory: 512Mi }
    # Fires the chart's default alert rules. No receiver yet, so alerts only
    # show up in its UI (and in Grafana's Alerting page).
    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 120h
        # Links in alerts point at the HTTPS ingress
        externalUrl: https://alertmanager.lab.felixlatulip.ca
        # Silences and notification state, can be rebuilt so plain longhorn
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests: { storage: 1Gi }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
      # LAN access, no login, same as Prometheus
      ingress:
        enabled: true
        hosts:
          - alertmanager.lab.felixlatulip.ca
        paths:
          - /
        pathType: Prefix

    # Talos binds these to localhost and Cilium replaces kube-proxy, so the
    # scrapes would just fail
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # The chart tolerates every NoSchedule taint, which zone-pods rejects
    # (ADR 0001). Only tolerate the control plane: trusted nodes only.
    prometheus-node-exporter:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 18GB
        # Pick up every ServiceMonitor/PodMonitor/rule in the cluster, not
        # just the ones labeled for this release
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # Metrics can be rebuilt, so plain longhorn (not retain)
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests: { storage: 20Gi }
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 2Gi }

      # LAN access. No login on Prometheus itself, same as the other *.lab apps.
      ingress:
        enabled: true
        hosts:
          - prometheus.lab.felixlatulip.ca
        paths:
          - /
        pathType: Prefix
