apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.1.1 # Prometheus Operator v0.95.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # All values: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    # Perses is the dashboard UI, no alerting set up (yet)
    grafana:
      enabled: false
    alertmanager:
      enabled: false

    # Talos binds these to localhost and Cilium replaces kube-proxy, so the
    # scrapes would just fail
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # The chart tolerates every NoSchedule taint, which zone-pods rejects
    # (ADR 0001). Only tolerate the control plane: trusted nodes only.
    prometheus-node-exporter:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 18GB
        # Pick up every ServiceMonitor/PodMonitor/rule in the cluster, not
        # just the ones labeled for this release
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # Metrics can be rebuilt, so plain longhorn (not retain)
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests: { storage: 20Gi }
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 2Gi }

      # LAN access. No login on Prometheus itself, same as the other *.lab apps.
      ingress:
        enabled: true
        hosts:
          - prometheus.lab.felixlatulip.ca
        paths:
          - /
        pathType: Prefix
