# local-path-provisioner: PersistentVolumes as directories on the node's disk.
# Simple and fast, but a volume lives on one node: if that node dies, its data
# is unavailable (pods using it can't move). Fine for a start; Longhorn later.
#
# Talos side: workers get a UserVolumeConfig directory at /var/mnt/local-path-provisioner
# (terraform/modules/talos-cluster/talos.tf).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
patches:
  # Talos's root fs is read-only; upstream's /opt/... won't work. /var/mnt is visible to the kubelet.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |-
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": ["/var/mnt/local-path-provisioner"]
              }
            ]
          }
  # Helper pods use hostPath to create/delete volume dirs; Talos enforces "baseline".
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged
  # PVCs without storageClassName get this one.
  - patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
