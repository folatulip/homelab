# local-path-provisioner: PersistentVolumes as directories on the node's disk.
#
# Talos side: every node gets a UserVolumeConfig directory at /var/mnt/local-path-provisioner
# (terraform/modules/talos-cluster/patches/common/local-path-volume.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
patches:
  # Talos's root fs is read-only; upstream's /opt/... won't work. /var/mnt is visible to the kubelet.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |-
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": ["/var/mnt/local-path-provisioner"]
              }
            ]
          }
        # Upstream template + no API token. Helper pods run on the PVC's node,
        # DMZ nodes included, as the provisioner's service account (it can
        # create pods in this privileged namespace). The token must never land
        # on a DMZ node. zone-pods (zone-isolation) rejects helper pods without this.
        helperPod.yaml: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            automountServiceAccountToken: false
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
            containers:
            - name: helper-pod
              image: docker.io/library/busybox
              imagePullPolicy: IfNotPresent
  # The helper pod template is only read at startup: bump this to restart the
  # provisioner after changing helperPod.yaml.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: local-path-provisioner
        namespace: local-path-storage
      spec:
        template:
          metadata:
            annotations:
              felixlatulip.ca/helper-pod-rev: "1"
  # Helper pods use hostPath to create/delete volume dirs; Talos enforces "baseline".
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged
  # Not the default: PVCs without storageClassName go to Longhorn.
  - patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
