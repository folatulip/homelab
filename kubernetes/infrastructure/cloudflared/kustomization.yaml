# Cloudflare Tunnel connector, on the DMZ nodes of k8s-geese. The tunnel is
# managed in the Cloudflare Zero Trust dashboard: each public hostname there
# points to http://traefik-dmz.traefik-dmz.svc.cluster.local, and traefik-dmz
# routes by Host header to the app's Ingress (kubernetes/apps/dmz/). Only
# outbound connections to Cloudflare; nothing on the LAN or router is opened.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflared
resources:
  - namespace.yaml
  - tunnel-token.sops.yaml
  - deployment.yaml
