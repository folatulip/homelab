# Every namespace says which zone it's in: felixlatulip.ca/zone = trusted|dmz.
# Flux adds the label (patches in kubernetes/cluster/), apps don't have to.
# The zone can't change afterwards: a dmz namespace turned trusted would get
# trusted network access while its pods still run on DMZ nodes. To move one,
# delete and recreate the namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: zone-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  variables:
    # Created by Kubernetes, Flux bootstrap or the Cilium chart, before Flux
    # can label them.
    - name: builtIn
      expression: >-
        object.metadata.name in ['default', 'kube-system', 'kube-public',
        'kube-node-lease', 'flux-system', 'cilium-secrets']
    - name: zone
      expression: >-
        has(object.metadata.labels) && 'felixlatulip.ca/zone' in object.metadata.labels
        ? object.metadata.labels['felixlatulip.ca/zone'] : ''
    - name: oldZone
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.labels)
        && 'felixlatulip.ca/zone' in oldObject.metadata.labels
        ? oldObject.metadata.labels['felixlatulip.ca/zone'] : ''
  validations:
    - expression: variables.builtIn || variables.zone in ['trusted', 'dmz']
      message: Namespaces need the label felixlatulip.ca/zone set to trusted or dmz (ADR 0001).
    - expression: variables.oldZone == '' || variables.zone == variables.oldZone
      message: The felixlatulip.ca/zone label can't change. Delete and recreate the namespace instead.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: zone-namespaces
spec:
  policyName: zone-namespaces
  validationActions: [Deny]
