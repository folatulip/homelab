# Trusted pods (every namespace not labeled dmz, except kube-system) never
# accept traffic from DMZ pods. A deny rule wins over any allow rule.
# enableDefaultDeny off: this only adds the deny, everything else stays
# allowed like before (tighten per app later).
# kube-system is left out so DMZ pods can still reach CoreDNS.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: trusted-deny-from-dmz
spec:
  description: Trusted pods never accept traffic from DMZ pods (ADR 0001).
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.felixlatulip.ca/zone
        operator: NotIn
        values: [dmz]
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [kube-system]
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.felixlatulip.ca/zone: dmz
