apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.1.0 # Traefik v3.7.15
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # All values: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
  values:
    deployment:
      replicas: 2
      # Routes to things outside the cluster (e.g. Proxmox) go in the
      # traefik-dynamic ConfigMap (apps/trusted/proxmox/). It's optional, so
      # Traefik still starts before that app is deployed.
      additionalVolumes:
        - name: traefik-dynamic
          configMap:
            name: traefik-dynamic
            optional: true
    additionalVolumeMounts:
      - name: traefik-dynamic
        mountPath: /etc/traefik/dynamic
        readOnly: true
    # Not the chart's providers.file, since that one would ship the same
    # routes to both clusters.
    additionalArguments:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    # One replica per node, so losing a node doesn't take ingress down.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
    # Only Ingresses with ingressClassName: traefik. traefik-dmz's IngressClass
    # has the same controller name, so without this it would serve both.
    providers:
      kubernetesIngress:
        ingressClass: traefik
    # Dashboard on :8080, not exposed by the Service; reach it with port-forward.
    api:
      insecure: true
    log:
      level: INFO
    accessLog:
      enabled: true
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    service:
      annotations:
        # Set per cluster (postBuild.substitute in kubernetes/clusters/<cluster>/).
        # MetalLB reads the first one, Cilium (k8s-geese) the second; each
        # ignores the other. Drop the MetalLB one with k8s-trusted.
        metallb.io/loadBalancerIPs: ${TRAEFIK_IP}
        lbipam.cilium.io/ips: ${TRAEFIK_IP}
      spec:
        externalTrafficPolicy: Local # keeps real client IPs in access logs
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { memory: 256Mi }
