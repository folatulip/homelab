apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.1.3 # Traefik v3.7.15
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # All values: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
  values:
    deployment:
      replicas: 2
      # Routes to things outside the cluster (e.g. Proxmox) go in the
      # traefik-dynamic ConfigMap (apps/trusted/proxmox/). It's optional, so
      # Traefik still starts before that app is deployed.
      additionalVolumes:
        - name: traefik-dynamic
          configMap:
            name: traefik-dynamic
            optional: true
    additionalVolumeMounts:
      - name: traefik-dynamic
        mountPath: /etc/traefik/dynamic
        readOnly: true
    # Not the chart's providers.file: it would put the routes in the Helm
    # values instead of the app's folder.
    additionalArguments:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    # One replica per node, so losing a node doesn't take ingress down.
    # nodeTaintsPolicy: Honor = don't count nodes Traefik can't run on (DMZ
    # nodes on k8s-geese). Otherwise dmz1 counts as an empty node, and the
    # extra pod of a rolling update is always "too much skew" -> Pending.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
    # Only Ingresses with ingressClassName: traefik. traefik-dmz's IngressClass
    # has the same controller name, so without this it would serve both.
    providers:
      kubernetesIngress:
        ingressClass: traefik
    # Dashboard on :8080, not exposed by the Service; reach it with port-forward.
    api:
      insecure: true
    log:
      level: INFO
    accessLog:
      enabled: true
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    service:
      annotations:
        # Fixed IP from the Cilium pool (postBuild.substitute in
        # kubernetes/cluster/infrastructure.yaml)
        lbipam.cilium.io/ips: ${TRAEFIK_IP}
      spec:
        externalTrafficPolicy: Local # keeps real client IPs in access logs
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { memory: 256Mi }
