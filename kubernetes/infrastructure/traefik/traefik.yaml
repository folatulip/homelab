apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-ingress-controller
  namespace: traefik
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
spec:
  replicas: 2
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      serviceAccountName: traefik-ingress-controller
      # One replica per worker, so losing a node doesn't take ingress down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: traefik }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: traefik
          image: traefik:v3.7.15
          args:
            - --entryPoints.web.address=:8000
            - --entryPoints.websecure.address=:8443
            - --entryPoints.websecure.http.tls=true
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressendpoint.publishedservice=traefik/traefik
            - --providers.kubernetescrd
            # Dashboard on :8080, not exposed by the Service; reach it with port-forward.
            - --api.dashboard=true
            - --api.insecure=true
            - --ping=true
            - --log.level=INFO
            - --accesslog=true
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
          ports:
            - { name: web, containerPort: 8000 }
            - { name: websecure, containerPort: 8443 }
            - { name: dashboard, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  annotations:
    # Fixed IP so DNS records for your apps can point at it.
    metallb.io/loadBalancerIPs: 10.10.20.201
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # keeps real client IPs in access logs
  selector: { app: traefik }
  ports:
    - { name: web, port: 80, targetPort: web }
    - { name: websecure, port: 443, targetPort: websecure }
