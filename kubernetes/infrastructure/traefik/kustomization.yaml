# Traefik ingress controller, installed with the official Helm chart.
# The CRDs come from the chart (crds: CreateReplace). They're marked
# prune: disabled on the cluster, so Flux never deletes them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
