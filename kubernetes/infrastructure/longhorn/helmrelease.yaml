apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # All values: https://github.com/longhorn/longhorn/blob/master/chart/values.yaml
  values:
    persistence:
      defaultClass: true # PVCs without storageClassName land here
      defaultClassReplicaCount: 2 # one copy per worker
      reclaimPolicy: Delete # deleting a PVC deletes the volume; backups on the NAS stay
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn # the dedicated disk (Talos UserVolumeConfig)
      defaultReplicaCount: '{"v1":"2","v2":"2"}' # volumes created in the UI
      storageReservedPercentageForDefaultDisk: 5 # the disk is Longhorn's alone (default 30)
    # Unraid share "longhorn", exported over NFS.
    defaultBackupStore:
      backupTarget: nfs://10.10.20.3:/mnt/user/longhorn
    longhornGlobalManager:
      replicas: 2 # two workers
