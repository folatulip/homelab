# Certificate expiry and ACME requests (controller, cainjector and webhook)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  podMetricsEndpoints:
    - port: http-metrics
