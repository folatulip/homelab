# traefik-dmz watches Ingresses and Services in its namespaces, so it needs
# the API server. Its RBAC only covers those namespaces.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-dmz-apiserver
  namespace: traefik-dmz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP }
