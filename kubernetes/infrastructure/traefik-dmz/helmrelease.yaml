apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-dmz
  namespace: traefik-dmz
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.1.0 # same as infrastructure/traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: Skip # the trusted Traefik (infrastructure/traefik) owns the CRDs
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  # All values: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
  values:
    deployment:
      replicas: 2
    # DMZ nodes only: the admin-only zone label + the DMZ taint (ADR 0001)
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-restriction.kubernetes.io/zone
                  operator: In
                  values: [dmz]
    tolerations:
      - key: felixlatulip.ca/zone
        operator: Equal
        value: dmz
        effect: NoSchedule
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway # only one DMZ node until k8s-trusted is gone
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-dmz-traefik-dmz
    # Only Ingresses with ingressClassName: traefik-dmz. Both IngressClasses
    # use the same controller name, so without this it would serve both.
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-dmz
    providers:
      kubernetesIngress:
        ingressClass: traefik-dmz
        publishedService:
          enabled: false # ClusterIP, nothing to publish
      # No IngressRoutes: the CRD provider can't be limited to one class
      # without annotating every resource, and it would see trusted ones.
      kubernetesCRD:
        enabled: false
    # Cloudflare terminates HTTPS, the tunnel sends plain HTTP to port 80.
    ports:
      websecure:
        expose:
          default: false
    service:
      spec:
        type: ClusterIP # cloudflared is in the cluster, no LAN IP needed
    # No dashboard on the public side
    api:
      dashboard: false
    log:
      level: INFO
    accessLog:
      enabled: true
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    resources:
      requests: { cpu: 50m, memory: 48Mi }
      limits: { memory: 192Mi }
