# Auto PR
#
# When a branch is pushed, open a pull request into main if it doesn't have one.
# - Title: subject of the branch's first commit
# - Body: description of that commit + the PR template
name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - 'renovate/**' # Renovate opens its own PRs

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}

jobs:
  open-pr:
    name: Open PR
    runs-on: ubuntu-24.04
    if: ${{ !github.event.deleted }} # nothing to do when a branch is deleted
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, needed to compare with main

      - name: Check if a PR is needed
        id: check
        run: |
          commits_ahead=$(git rev-list --count origin/main..HEAD)
          open_pr=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')

          if [ "$commits_ahead" -eq 0 ]; then
            echo "Branch has no new commits, skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$open_pr" ]; then
            echo "PR already open: $open_pr"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.check.outputs.needed == 'true'
        run: |
          first_commit=$(git rev-list --reverse origin/main..HEAD | head -n 1)
          title=$(git log -1 --format=%s "$first_commit")

          body_file="$RUNNER_TEMP/pr-body.md"
          git log -1 --format=%b "$first_commit" > "$body_file"
          echo "" >> "$body_file"
          cat .github/pull_request_template.md >> "$body_file"

          gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body_file"
