# Checks every change before Flux deploys it. This is CI only: deployment is
# Flux pulling main from inside the cluster, and Terraform is applied by hand
# (the runners can't reach Proxmox/Talos, and the state holds cluster secrets).
#
# Tool versions are bumped by Renovate (the "# renovate:" comments).
name: CI

# Runs on every branch push rather than on pull_request: PRs opened by the
# Auto PR workflow use GITHUB_TOKEN, and GitHub doesn't fire pull_request
# workflows for those. Checks attach to the commit, so the PR still shows them.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TERRAFORM_VERSION: v1.16.6
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: v0.64.0
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: v8.30.1

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init (no backend, no credentials)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits on plugin download
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  talos:
    name: Talos config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install talosctl (same version as the cluster, from terraform/main.tf)
        run: |
          v=$(sed -n 's/.*talos_version *= *"\(v[0-9.]*\)".*/\1/p' terraform/main.tf | head -1)
          curl -sSfL -o /usr/local/bin/talosctl \
            "https://github.com/siderolabs/talos/releases/download/${v}/talosctl-linux-amd64"
          chmod +x /usr/local/bin/talosctl
          talosctl version --client --short
      - name: Validate patched configs
        run: scripts/ci/validate-talos.sh

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" |
            tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Render and validate
        run: scripts/ci/validate-kubernetes.sh

  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/main' # main only gets merges of linted branches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need main's history to find this branch's commits
      - name: Conventional Commits
        run: scripts/ci/lint-commits.sh origin/main..HEAD

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" |
            tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks
        run: gitleaks git --redact --no-banner --verbose .
