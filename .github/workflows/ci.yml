# CI
#
# Runs the checks on every push. Nothing gets deployed from here:
# - Flux pulls main from inside the cluster
# - Terraform is applied by hand (runners can't reach Proxmox/Talos, and the
#   state has cluster secrets in it)
#
# Tool versions are updated by Renovate (see the "# renovate:" comments).
name: CI

# Using push instead of pull_request because PRs opened by Auto PR use
# GITHUB_TOKEN, and those don't trigger pull_request workflows.
# The checks still show up on the PR since they run on the same commit.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TERRAFORM_VERSION: v1.16.6
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: v0.64.0
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: v8.30.1

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -backend=false -input=false # no backend, so no credentials needed

      - name: Validate
        run: terraform validate

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }} # so plugin downloads don't get rate limited
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  talos:
    name: Talos config
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the same talosctl version as the cluster (from terraform/main.tf)
      - name: Install talosctl
        run: |
          talos_version=$(sed -n 's/.*talos_version *= *"\(v[0-9.]*\)".*/\1/p' terraform/main.tf | head -1)
          url="https://github.com/siderolabs/talos/releases/download/${talos_version}/talosctl-linux-amd64"

          curl -sSfL -o /usr/local/bin/talosctl "$url"
          chmod +x /usr/local/bin/talosctl
          talosctl version --client --short

      - name: Validate configs
        run: scripts/ci/validate-talos.sh

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform
        run: |
          url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          curl -sSfL "$url" | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate manifests
        run: scripts/ci/validate-kubernetes.sh

  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/main' # main only gets merges from branches that already passed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, needed to compare with main

      - name: Lint commit messages
        run: scripts/ci/lint-commits.sh origin/main..HEAD

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so old commits get scanned too

      - name: Install gitleaks
        run: |
          version_number=${GITLEAKS_VERSION#v} # the file name has no "v" in it
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${version_number}_linux_x64.tar.gz"

          curl -sSfL "$url" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --verbose .
